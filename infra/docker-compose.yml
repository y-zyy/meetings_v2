version: "3.9"

x-api-env: &api-env
  env_file: ../.env

x-worker-common: &worker-common
  image: meetings-backend:261006
  build:
    context: ../backend
    dockerfile: Dockerfile
  restart: unless-stopped
  <<: *api-env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - ../data/uploads:/app/data/uploads
    - ../backend/data/correction_rules_seed.json:/app/data/correction_rules_seed.json:ro
  networks:
    - internal
    - db

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # compose 보간은 infra/.env 만 읽으므로, 루트 .env 의 POSTGRES_* 를 컨테이너에 직접 주입한다.
    # (POSTGRES_PASSWORD 미설정 시 postgres 이미지가 기동을 거부한다)
    <<: *api-env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-meetings} -d $${POSTGRES_DB:-meetings}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # DB 전용 네트워크(외부 접근 불가). nginx 는 연결하지 않는다.
    # 디버깅 시 포트가 필요하면 127.0.0.1:5432:5432 처럼 로컬호스트에만 바인딩할 것.
    networks:
      - db

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  # ── FastAPI ───────────────────────────────────────────────────────────────
  api:
    image: meetings-backend:261006
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../data/uploads:/app/data/uploads   # 호스트 경로에 직접 저장
    networks:
      - internal
      - db
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Celery workers (stage-isolated queues) ────────────────────────────────
  worker-ingest:
    <<: *worker-common
    command:
      - /bin/sh
      - -c
      - >-
        exec celery -A app.workers.celery_app worker
        --loglevel=info
        --concurrency="$${INGEST_WORKER_CONCURRENCY:-2}"
        --queues=ingest

  worker-asr:
    <<: *worker-common
    command:
      - /bin/sh
      - -c
      - >-
        exec celery -A app.workers.celery_app worker
        --loglevel=info
        --concurrency="$${ASR_WORKER_CONCURRENCY:-10}"
        --queues=asr

  worker-postprocess:
    <<: *worker-common
    command:
      - /bin/sh
      - -c
      - >-
        exec celery -A app.workers.celery_app worker
        --loglevel=info
        --concurrency="$${POSTPROCESS_WORKER_CONCURRENCY:-10}"
        --queues=postprocess

  worker-minutes:
    <<: *worker-common
    command:
      - /bin/sh
      - -c
      - >-
        exec celery -A app.workers.celery_app worker
        --loglevel=info
        --concurrency="$${MINUTES_WORKER_CONCURRENCY:-10}"
        --queues=minutes

  # ── Nginx ─────────────────────────────────────────────────────────────────
  nginx:
    image: meetings-frontend:261006
    build:
      context: ..
      dockerfile: service/frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:80"   # HTTP -> HTTPS 리다이렉트
      - "0.0.0.0:8443:443"  # HTTPS (자체 서명 인증서, infra/nginx/gen-selfsigned-cert.sh 로 생성)
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ../service/frontend:/usr/share/nginx/html:ro  # login-bg.jpg 파일을 이 폴더에 넣으면 로그인 배경 이미지로 적용됨
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  # uploads 볼륨은 bind mount로 대체되어 제거됨

networks:
  internal:
    driver: bridge
  # postgres 전용: internal:true 로 외부(호스트/인터넷) 라우팅 차단
  db:
    driver: bridge
    internal: true
