version: "3.9"

x-api-env: &api-env
  env_file: ../.env

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: meetings
      POSTGRES_USER: meetings
      POSTGRES_PASSWORD: meetings
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetings"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  # ── FastAPI ───────────────────────────────────────────────────────────────
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../data/uploads:/app/data/uploads   # 호스트 경로에 직접 저장
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Celery worker ─────────────────────────────────────────────────────────
  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info
      --concurrency=4
      --queues=celery
    <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../data/uploads:/app/data/uploads   # 호스트 경로에 직접 저장
      - ../backend/data/correction_rules_seed.json:/app/data/correction_rules_seed.json:ro
    networks:
      - internal

  # ── Nginx ─────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:80"   # HTTP -> HTTPS 리다이렉트
      - "0.0.0.0:8443:443"  # HTTPS (자체 서명 인증서, infra/nginx/gen-selfsigned-cert.sh 로 생성)
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ../service/frontend:/usr/share/nginx/html:ro  # login-bg.jpg 파일을 이 폴더에 넣으면 로그인 배경 이미지로 적용됨
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  # uploads 볼륨은 bind mount로 대체되어 제거됨

networks:
  internal:
    driver: bridge
