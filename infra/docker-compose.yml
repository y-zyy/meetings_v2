version: "3.9"

x-api-env: &api-env
  env_file: ../.env

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: meetings
      POSTGRES_USER: meetings
      POSTGRES_PASSWORD: meetings
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetings"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  # ── FastAPI ───────────────────────────────────────────────────────────────
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../data/uploads:/app/data/uploads   # 호스트 경로에 직접 저장
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Celery worker: ASR 큐 ────────────────────────────────────────────────
  # 음성인식(원격 ASR 서버 호출) 전용. 기존 concurrency=4 그대로 유지.
  worker-asr:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info
      --concurrency=4
      --queues=asr
      --hostname=worker-asr@%h
    <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../data/uploads:/app/data/uploads   # 호스트 경로에 직접 저장
      - ../backend/data/correction_rules_seed.json:/app/data/correction_rules_seed.json:ro
    networks:
      - internal

  # ── Celery worker: LLM 큐 ────────────────────────────────────────────────
  # STT 후처리 + 회의록 요약(LLM 서버 호출) 전용. 프로세스당 무거운 모델을
  # 물고 있지 않고 대부분 시간을 네트워크 응답 대기로 보내므로, ASR 큐보다
  # concurrency를 넉넉히 잡아 동시에 여러 회의의 LLM 요청을 처리한다.
  # (LLM 서버가 감당 가능한 동시 요청 수에 맞춰 조정할 것.)
  worker-llm:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info
      --concurrency=12
      --queues=llm
      --hostname=worker-llm@%h
    <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../data/uploads:/app/data/uploads   # 호스트 경로에 직접 저장
      - ../backend/data/correction_rules_seed.json:/app/data/correction_rules_seed.json:ro
    networks:
      - internal

  # ── Nginx ─────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:80"   # HTTP -> HTTPS 리다이렉트
      - "0.0.0.0:8443:443"  # HTTPS (자체 서명 인증서, infra/nginx/gen-selfsigned-cert.sh 로 생성)
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ../service/frontend:/usr/share/nginx/html:ro  # login-bg.jpg 파일을 이 폴더에 넣으면 로그인 배경 이미지로 적용됨
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  # uploads 볼륨은 bind mount로 대체되어 제거됨

networks:
  internal:
    driver: bridge
